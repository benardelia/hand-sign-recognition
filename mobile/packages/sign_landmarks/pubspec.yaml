name: sign_landmarks
description: "MediaPipe HolisticLandmarker for Android and iOS, producing 1662-float holistic frames."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.scribesign.sign_landmarks
        pluginClass: SignLandmarksPlugin
      ios:
        pluginClass: SignLandmarksPlugin
